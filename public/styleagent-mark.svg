  <path d="M38 84C46 61 62 48 84 48C99 48 113 54 124 64" stroke="url(#blueArc)" stroke-width="11" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M82 48C100 49 114 55 124 64" stroke="url(#amberArc)" stroke-width="11" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M53 49C60 42 71 37 84 37" stroke="#DDE4EE" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
