<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StyleAgent mark">
  <defs>
    <linearGradient id="bgRing" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E7685"/>
      <stop offset="50%" stop-color="#2B313C"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="innerGlass" x1="42" y1="38" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E3642"/>
      <stop offset="55%" stop-color="#11161E"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="blueArc" x1="38" y1="72" x2="79" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36597A"/>
      <stop offset="100%" stop-color="#8CB9E8"/>
    </linearGradient>
    <linearGradient id="amberArc" x1="77" y1="47" x2="122" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0C777"/>
      <stop offset="100%" stop-color="#9A5C2F"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 80) rotate(90) scale(48)">
      <stop offset="0%" stop-color="#1D2430"/>
      <stop offset="100%" stop-color="#090C12"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
